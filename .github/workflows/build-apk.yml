name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Do NOT install obsolete package "tools" (removed from Google SDK repo)
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0 platforms;android-35 cmdline-tools;latest

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble release (debug-signed, sideloadable)
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SpiritScan-apk
          path: app/build/outputs/apk/release/*.apk
