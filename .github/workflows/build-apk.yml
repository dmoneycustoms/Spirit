name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiritScan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Also copy with friendly name
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SpiritScan.apk
          ls -lh release/

      - name: Upload friendly-named APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiritScan
          path: release/SpiritScan.apk
          retention-days: 14
